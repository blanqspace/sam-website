<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kontakt – SAM Handel & Logistik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <img src="img/logo.png" alt="SAM Logo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="about.html">Über uns</a></li>
        <li><a href="contact.html" class="active">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Kontaktieren Sie uns</h1>
      <p class="subtext">Wir freuen uns auf Ihre Nachricht!</p>
    </div>
  </section>

  <section class="intro">
    <form action="https://formspree.io/f/xoverren" method="POST" style="max-width: 500px; margin: 2rem auto; display: flex; flex-direction: column; gap: 1rem;">
      <input type="text" name="name" placeholder="Ihr Name" required>
      <input type="email" name="email" placeholder="Ihre E-Mail" required>
      <textarea name="message" rows="5" placeholder="Ihre Nachricht" required></textarea>
      <button type="submit" class="cta-button">Nachricht senden</button>
    </form>

    <div style="margin-top: 2rem; text-align: left; max-width: 500px; margin-left: auto; margin-right: auto;">
      <p><strong>📍 Adresse:</strong> Harzstraße 11, 37081 Göttingen</p>
      <p><strong>📞 Telefon:</strong> <a href="tel:+4915901016357">+49 159 010 163 57</a></p>
      <p><strong>📧 E-Mail:</strong> <a href="mailto:info@sam-logistics.de">info@sam-logistics.de</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 SAM Handel & Logistik – Göttingen | info@sam-logistics.de</p>
  </footer>

  <a href="https://wa.me/4915901016357" target="_blank" class="whatsapp-float">
    <img src="img/whatsapp-icon.png" alt="WhatsApp" />
  </a>
</body>
</html>
